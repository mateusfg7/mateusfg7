# Visit https://github.com/lowlighter/metrics/blob/master/action.yml for full reference
name: Metrics
on:
  # Schedule updates (every day at 00:00h)
  schedule: [{ cron: "0 0 * * 1,3" }]
  # Lines below let you run workflow manually and on each commit
  workflow_dispatch:
  push: { branches: ["master", "main"] }
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # - uses: lowlighter/metrics@latest
      - uses: gh-metrics/metrics@master
        with:
          # Your GitHub token
          # The following scopes are required:
          #  - public_access (default scope)
          #  - repo
          # The following additional scopes may be required:
          #  - read:org  (for organization related metrics)
          #  - read:user (for user related data)
          #  - repo      (optional, if you want to include private repositories)
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: mateusfg7
          template: classic

          config_display: large
          config_timezone: America/Sao_Paulo
          config_animations: yes

          base: header, activity, repositories, metadata, community
          base_indepth: yes
          repositories_forks: yes
          repositories: 100
          repositories_affiliations: owner, collaborator
          # commits_authoring: Mateus Felipe Gonçalves, Mateus Felipe, mateusfg7, mateusfg7@users.noreply.github.com

          plugins_errors_fatal: false
          debug: true

          plugin_lines: yes
          plugin_lines_history_limit: 3

          plugin_traffic: yes

          plugin_languages: yes
          plugin_languages_ignored: scss, css, html, qml, perl, lua, ruby, objective-c++, objective-c, jupyter notebook, mdx, markdown, dockerfile, javascript, dart, tsx, starlark, powershell, shell, vbscript, makefile, vim script, smarty, nix, renderscript, qmake
          plugin_languages_analysis_timeout: 60
          plugin_languages_analysis_timeout_repositories: 0
          plugin_languages_categories: programming
          # plugin_languages_colors: github
          plugin_languages_details: lines
          plugin_languages_indepth: yes
          # plugin_languages_limit: 8
          plugin_languages_recent_categories: programming
          plugin_languages_recent_days: 365
          plugin_languages_recent_load: 1000
          plugin_languages_sections: most-used, recently-used
          plugin_languages_other: no

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_habits_facts: yes

          plugin_habits: yes
          plugin_habits_from: 1000
          plugin_habits_days: 30
          plugin_habits_trim: yes

          plugin_notable: yes
          # plugin_notable_filter: commits
          # plugin_notable_from: all
          plugin_notable_indepth: yes
          plugin_notable_types: commit,pull_request,issue
          #plugin_notable_self: yes # include own repositories

          plugin_activity: yes
          plugin_activity_visibility: public

          plugin_introduction: yes

          # plugin_achievements: yes
          # plugin_achievements_threshold: B
          # plugin_achievements_secrets: no

          # plugin_topics: yes
          # plugin_topics_limit: 20
          # plugin_topics_m1ode: icons
          # plugin_topics_sort: starred

          plugin_code: yes
          plugin_code_lines: 6
